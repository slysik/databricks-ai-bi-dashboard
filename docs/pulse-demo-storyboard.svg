<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Pulse five-minute demo storyboard</title>
  <desc id="desc">A four-step demo sequence covering pipeline, executive dashboard, Genie answer, and business value.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#052f49"/><stop offset="1" stop-color="#0b7d84"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity=".18"/></filter>
    <style>.t{font:700 34px Inter,Arial,sans-serif;fill:#fff}.st{font:400 17px Inter,Arial,sans-serif;fill:#c9e8ec}.card{fill:#fff;stroke:#cadde6;stroke-width:2;rx:18;filter:url(#s)}.n{font:800 15px Inter,Arial,sans-serif;fill:#fff}.h{font:700 21px Inter,Arial,sans-serif;fill:#102a43}.p{font:400 14px Inter,Arial,sans-serif;fill:#557384}.say{font:600 14px Inter,Arial,sans-serif;fill:#0b6478}.cap{font:700 11px Inter,Arial,sans-serif;fill:#748a96;letter-spacing:1px}.line{stroke:#168ba0;stroke-width:4;fill:none}.temp{stroke:#ee8b2d;stroke-width:4;fill:none}.axis{stroke:#b7cbd4;stroke-width:1}.dot{fill:#168ba0}</style>
  </defs>
  <rect width="1400" height="760" fill="#f3f7fa"/>
  <rect width="1400" height="120" fill="url(#bg)"/>
  <text x="55" y="52" class="t">Pulse demo storyboard · 5 minutes</text>
  <text x="55" y="86" class="st">Show engineering depth, governance, and executive value without switching products</text>

  <g transform="translate(45 155)"><rect class="card" width="310" height="250"/><circle cx="34" cy="35" r="18" fill="#0b7588"/><text x="29" y="41" class="n">1</text><text x="64" y="42" class="h">Show the pipeline</text><text x="24" y="79" class="cap">PAIN</text><text x="24" y="104" class="p">Raw operational feeds are slow to trust.</text><text x="24" y="137" class="cap">DEMO</text><text x="24" y="162" class="p">Open the Bronze → Silver → Gold graph.</text><text x="24" y="195" class="cap">SAY</text><text x="24" y="220" class="say">“Quality failures are visible and quarantined.”</text></g>
  <g transform="translate(380 155)"><rect class="card" width="310" height="250"/><circle cx="34" cy="35" r="18" fill="#0b7588"/><text x="29" y="41" class="n">2</text><text x="64" y="42" class="h">Lead with the finding</text><text x="24" y="79" class="cap">HEADLINE</text><text x="24" y="110" class="say">West drove $9.43M exposure</text><text x="24" y="137" class="p">Reliability 96.72 · 152K customers</text><rect x="24" y="160" width="230" height="11" rx="6" fill="#e5eef2"/><rect x="24" y="160" width="214" height="11" rx="6" fill="#168ba0"/><rect x="24" y="187" width="230" height="11" rx="6" fill="#e5eef2"/><rect x="24" y="187" width="175" height="11" rx="6" fill="#46aeb8"/><text x="24" y="228" class="say">“The dashboard tells us where to act first.”</text></g>
  <g transform="translate(715 155)"><rect class="card" width="310" height="250"/><circle cx="34" cy="35" r="18" fill="#0b7588"/><text x="29" y="41" class="n">3</text><text x="64" y="42" class="h">Ask Pulse AI</text><text x="24" y="78" class="p">“Show daily peak demand and average</text><text x="24" y="99" class="p">temperature by region in the heat wave.”</text><line x1="35" y1="207" x2="280" y2="207" class="axis"/><line x1="35" y1="125" x2="35" y2="207" class="axis"/><path d="M40 191 C85 187 98 168 135 174 S200 112 275 130" class="line"/><path d="M40 185 C90 180 110 178 145 160 S210 123 275 120" class="temp"/><text x="24" y="232" class="say">Correct grain · chronology · average temperature</text></g>
  <g transform="translate(1050 155)"><rect class="card" width="305" height="250"/><circle cx="34" cy="35" r="18" fill="#0b7588"/><text x="29" y="41" class="n">4</text><text x="64" y="42" class="h">Prove trust</text><text x="24" y="79" class="cap">SHOW</text><text x="24" y="104" class="p">Generated SQL</text><text x="24" y="129" class="p">Signed-in identity</text><text x="24" y="154" class="p">Unity Catalog permissions</text><text x="24" y="187" class="cap">LAND</text><text x="24" y="216" class="say">“Natural language replaces report authoring—</text><text x="24" y="237" class="say">not governance or verification.”</text></g>

  <g transform="translate(45 445)"><rect class="card" width="1310" height="250"/><text x="28" y="42" class="h">Demo close: from vague question to governed action</text><text x="28" y="75" class="p">One platform connects the landing zone, declarative data quality, executive metrics, and conversational analysis.</text>
    <g transform="translate(28 108)"><rect width="285" height="92" rx="12" fill="#edf7f8"/><text x="18" y="28" class="cap">RETRIEVAL</text><text x="18" y="55" class="say">Ask for data not on the standard view</text><text x="18" y="76" class="p">Pin the result for leadership</text></g>
    <g transform="translate(345 108)"><rect width="285" height="92" rx="12" fill="#edf7f8"/><text x="18" y="28" class="cap">REASONING</text><text x="18" y="55" class="say">Explain the chart and root cause</text><text x="18" y="76" class="p">Inspect SQL before acting</text></g>
    <g transform="translate(662 108)"><rect width="285" height="92" rx="12" fill="#edf7f8"/><text x="18" y="28" class="cap">PERSONALIZATION</text><text x="18" y="55" class="say">Surface what each leader uses</text><text x="18" y="76" class="p">Evolve beyond static dashboards</text></g>
    <g transform="translate(979 108)"><rect width="285" height="92" rx="12" fill="#0b6f82"/><text x="18" y="28" class="cap" fill="#cceff1">BUSINESS VALUE</text><text x="18" y="55" style="font:700 16px Inter,Arial,sans-serif;fill:#fff">Faster decisions, fewer BI handoffs</text><text x="18" y="76" style="font:400 13px Inter,Arial,sans-serif;fill:#d9f1f2">One governed answer surface</text></g>
  </g>
</svg>
